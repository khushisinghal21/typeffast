services:
  # ── Next.js Web App ────────────────────────────────────────
  - type: web
    name: typefast-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && cd DB_prisma && npx prisma generate && cd .. && npm run build
    startCommand: node .next/standalone/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: 0.0.0.0
      # ── Fill these in the Render dashboard ──────────────────
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false

  # ── WebSocket Server ───────────────────────────────────────
  - type: web
    name: typefast-ws
    runtime: node
    plan: free
    rootDir: apps/ws
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: WS_PORT
        value: 10000
      - key: WS_HOST
        value: 0.0.0.0
    healthCheckPath: /
